# Weekly mutation testing. Sharded 2026-07-11; re-sharded 2026-07-13: the
# single `lib/quant/**` shard STILL hit the 6-hour job limit on 2026-07-12 —
# cancelled at 97% tested (4,124/4,154; 1,324 survived + 38 TO; interim score
# ≈68%), nine minutes from the finish line. quant is now split into two
# sub-shards (indicator family vs the rest), each well inside the limit.
#
# GATE ENFORCED 2026-08-02. The long-standing `continue-on-error: true` carried
# the note "until the ≥70% baseline holds on every shard". That precondition is
# now met, on TWO consecutive runs including a scheduled Sunday one — so the
# escape hatch is removed and a sub-70 shard now fails the workflow for real
# (Stryker already exits non-zero via `break: 70` in stryker.conf.mjs).
#
#   shard             2026-08-01 (dispatch)   2026-08-02 (schedule)
#   backtest                        71.02                   71.02
#   options                         71.38                   71.25
#   quant-rest                      75.14                   75.14
#   quant-indicators                86.83                   86.83
#
# Journey: backtest 31.22 (2026-07-12) → 58.69 → 63.50 → 69.99 → 71.02;
# options 62.25 → pass; quant-rest 53.80 → 75.14; quant-indicators 60.49 → 86.83.
#
# Margins are thin on backtest (+1.02) and options (+1.25), which is the point:
# a real regression should now break the build rather than silently drift.
# If a shard fails, read the JOB log for the per-file table — do NOT trust the
# workflow badge alone (it stayed green through 5 weeks of dead runs; lesson
# recorded 2026-07-10).
#
# KNOWN, UNRESOLVED: quant-indicators has previously reported a bimodal score
# (74.29 on scheduled runs vs 86.83 on dispatches, same commit) driven by
# indicators.ts/multiTimeframe.ts coverage attribution. It did NOT recur on
# 2026-08-02, and even its low mode (74.29) clears 70 — but if this workflow
# starts failing on that shard alone, suspect the swing before suspecting a
# real regression. See workspace/SESSION_STATE.json → mutation_gate_verification.
#
# RE-SHARDED 2026-10-17 (Q-151). quant-indicators ran ~3h every week (999 of its
# 1,816 mutants are static and take 96% of the time) and on 2026-10-11 a slower
# runner left it at 62% when GitHub's 6-hour JOB limit cancelled it. A cancelled
# job reads as "inconclusive" to the alerter, so the in-workflow alert said
# nothing; only the heartbeat noticed. Two fixes:
#   - the shard is split: indicators.ts (844 mutants) | the other three (972);
#   - the stryker step carries its own timeout, so overrunning it FAILS the
#     job (a step timeout is a failure; a job timeout is a cancellation).
# The 70% break threshold applies per shard; on the 2026-10-04 figures the two
# halves score ~90.6 and ~84.4.
name: Stryker Weekly

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  stryker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: quant-indicators
            mutate: 'lib/quant/indicators.ts'
          - name: quant-indicators-family
            mutate: 'lib/quant/btc-indicators.ts,lib/quant/technicals.ts,lib/quant/multiTimeframe.ts'
          - name: quant-rest
            mutate: 'lib/quant/**/*.ts,!lib/quant/indicators.ts,!lib/quant/btc-indicators.ts,!lib/quant/technicals.ts,!lib/quant/multiTimeframe.ts'
          - name: backtest
            mutate: 'lib/backtest/**/*.ts'
          - name: options
            mutate: 'lib/options/**/*.ts'
    name: stryker (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Stryker
        # Under GitHub's 360-minute job limit, so an overrun is a FAILED step
        # (which alerts) rather than a cancelled job (which the alerter cannot
        # distinguish from a human pressing cancel).
        timeout-minutes: 330
        run: npx stryker run --mutate "${{ matrix.shard.mutate }}"

  # Q107-O2: a scheduled workflow that fails silently is how this repo lost a
  # fortnight of data. `always()` is load-bearing — without it this job is skipped
  # on failure, which is precisely the case it exists for.
  alert:
    # Q107-O4 — see nightly-backtest.yml.
    name: alert-stryker-weekly
    needs: [stryker]
    if: always()
    uses: ./.github/workflows/scheduled-failure-alert.yml
    # A CALLER's job permissions are the ceiling for the CALLED workflow, exactly
    # as a workflow-level block is the ceiling for its jobs. Granting only
    # `issues: write` here zeroes `contents`, and scheduled-failure-alert.yml's
    # job asks for `contents: read` because it runs actions/checkout — so the
    # whole file was REJECTED (startup_failure, zero jobs) on every wired
    # workflow. Both scopes must be granted at BOTH levels.
    permissions:
      contents: read
      issues: write
    with:
      workflow: stryker-weekly.yml
      conclusion: ${{ needs.stryker.result }}
      detail: ${{ 'The weekly mutation gate did not complete. A missing run is not a passing run.' }}
