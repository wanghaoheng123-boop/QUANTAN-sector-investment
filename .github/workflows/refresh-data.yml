name: Weekly Data Refresh

on:
  schedule:
    # Sundays 22:00 UTC — after weekly market close, before Monday's pre-market
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  # A workflow-level permissions block is a CEILING, not a default: a job may
  # narrow it but never exceed it. The alert job requests `issues: write`, and
  # without this line the whole FILE is rejected — GitHub reports
  # `startup_failure` with zero jobs, which reads exactly like the unparseable
  # workflow this package already shipped once. Verified live: run 33646555241.
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      # Exposed so the alert job can say WHICH kind of red this was: a quarantine
      # (data committed, deliberate) or a real break (nothing committed).
      quarantine: ${{ steps.refresh.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # scripts/fetchBacktestData.mjs already exits non-zero when a ticker
      # throws or trips an integrity floor (its `failed > 0` guard), so a hard
      # fetch failure fails this step and every step below it is skipped.
      # Exit 2 means "some instruments were QUARANTINED by the vintage guard, and
      # every fixture that WAS written is verified append-only". Those writes are
      # safe to commit; the run still ends red at the end of the job so a human
      # looks. Treating 2 as failure here is what discarded 55 clean refreshes and
      # deadlocked the pipeline for a fortnight.
      - name: Refresh backtest data from Yahoo Finance
        id: refresh
        run: |
          set +e
          node scripts/fetchBacktestData.mjs
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then exit 0; fi
          exit $code

      # AL-6 (2026-08-15): the hole the guard above does NOT cover.
      #
      # A fetch can "succeed" for all 56 instruments and still leave the
      # fixtures untouched — a Yahoo outage serving cached bodies, an upstream
      # schema change that lands zero new rows, a silently-empty response. That
      # produced no diff, the commit step below printed "No data changes" and
      # exited 0, and the run showed a GREEN CHECK. Nothing in the pipeline
      # could tell "the market did not move" (impossible across a week for 56
      # instruments) from "the fetch brought back nothing", and nothing asserted
      # the fixtures' newest bar was recent. The nightly backtest cannot catch
      # this either — a frozen fixture yields a perfectly stable win rate
      # forever.
      #
      # This step is the assertion that gives the refresh teeth: every fixture's
      # newest bar must be within MAX_STALE_DAYS of now, or the run goes RED and
      # the commit/push below never runs. 5 days clears the worst legitimate
      # case (a Sunday 22:00 UTC run whose newest equity bar is Friday's open,
      # plus a holiday-shortened week); anything past that is a failed refresh,
      # not a quiet market.
      # QUARANTINED tickers are held at their previous vintage ON PURPOSE, so a
      # freshness check that does not know that reads them as a failed fetch. It
      # did exactly that on run 33949824086: BTC was quarantined, this gate exited
      # 1, `if: success()` skipped the commit, and all 55 clean refreshes were
      # discarded — reproducing ONE GATE DOWNSTREAM the same amplifier the
      # exit-code split was written to remove. A concept every gate in a chain
      # must understand cannot live in only one of them.
      - name: Assert fixture freshness
        env:
          MAX_STALE_DAYS: '5'
          QUARANTINED: ${{ steps.refresh.outputs.quarantined }}
        run: |
          node - <<'NODE'
          const { readdirSync, readFileSync } = require('node:fs')
          const path = require('node:path')

          const DIR = 'scripts/backtestData'
          const MAX_STALE_DAYS = Number(process.env.MAX_STALE_DAYS || 5)
          const DAY_MS = 86400000
          const now = Date.now()

          const files = readdirSync(DIR).filter((f) => f.endsWith('.json'))
          if (files.length === 0) {
            console.error(`FAIL: no fixtures found in ${DIR} — the refresh produced nothing.`)
            process.exit(1)
          }

          const bad = []
          let newest = null
          const held = []
          const QUARANTINED = new Set(
            (process.env.QUARANTINED || '').split(',').map((t) => t.trim()).filter(Boolean),
          )

          for (const file of files) {
            const ticker = file.replace(/\.json$/, '')
            let parsed
            try {
              parsed = JSON.parse(readFileSync(path.join(DIR, file), 'utf8'))
            } catch (err) {
              bad.push(`${ticker}: unreadable — ${err.message}`)
              continue
            }
            const candles = Array.isArray(parsed.candles) ? parsed.candles : []
            const last = candles[candles.length - 1]
            if (!last || !Number.isFinite(last.time)) {
              bad.push(`${ticker}: no usable final bar (${candles.length} candles)`)
              continue
            }
            const lastMs = last.time * 1000
            if (newest == null || lastMs > newest) newest = lastMs
            const ageDays = (now - lastMs) / DAY_MS
            if (ageDays > MAX_STALE_DAYS) {
              const day = new Date(lastMs).toISOString().slice(0, 10)
              const line = `${ticker}: newest bar ${day} is ${ageDays.toFixed(1)} days old`
              // Stale ON PURPOSE: the vintage guard kept the previous fixture
              // rather than accept a disputed bar. Report it, never fail on it —
              // failing here discards every OTHER ticker's clean refresh.
              if (QUARANTINED.has(ticker)) held.push(line)
              else bad.push(line)
            }
          }

          console.log(`Checked ${files.length} fixtures against a ${MAX_STALE_DAYS}-day ceiling.`)
          if (newest != null) {
            console.log(`Newest bar across all fixtures: ${new Date(newest).toISOString().slice(0, 10)}`)
          }

          if (held.length > 0) {
            console.log(`\n${held.length} fixture(s) intentionally held by the vintage guard (NOT a failure):`)
            for (const line of held) console.log(`  - ${line}`)
            console.log(`The alert job reports these; they must not block the other tickers' commit.`)
          }

          if (bad.length > 0) {
            console.error(`\nFAIL: ${bad.length}/${files.length} fixture(s) stale or unusable after the refresh:`)
            for (const line of bad) console.error(`  - ${line}`)
            console.error(`\nFixtures this old mean the refresh FAILED — this is not "no market change".`)
            console.error(`Refusing to commit. Investigate the fetch (upstream outage, schema change,`)
            console.error(`rate limiting) before re-running this workflow.`)
            process.exit(1)
          }

          console.log('OK: every fixture is within the freshness ceiling.')
          NODE

      # `if: success()` is the default, but it is stated explicitly on both
      # steps below: the whole point of the gate above is that nothing commits
      # or pushes when the data is not verifiably fresh.
      - name: Configure git
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit & push if changed
        if: success()
        run: |
          # A no-diff run stays a SKIP rather than a failure — a same-day
          # workflow_dispatch re-run legitimately produces no diff, and the
          # freshness gate above has already proven the data is current. That
          # gate, not this branch, is what catches a dead fetch.
          if git diff --quiet -- scripts/backtestData/; then
            echo "No data changes — skipping commit (fixtures verified fresh above)."
            exit 0
          fi
          git add scripts/backtestData/
          git commit -m "chore(data): weekly backtest data refresh ($(date -u +'%Y-%m-%d'))"
          git push origin HEAD:main

      # Placed LAST, on purpose: the quarantined data has already been committed
      # by the step above, and this turns the run red so the event is visible.
      # Q107-O2 is still open — nothing NOTIFIES on a red scheduled run — so this
      # is necessary and not yet sufficient.
      - name: Fail the run if anything was quarantined
        if: steps.refresh.outputs.code == '2'
        run: |
          echo "::error title=Vintage quarantine::One or more instruments were refused by the vintage guard. Clean fixtures were committed; investigate the named bars."
          exit 1

  # Q107-O2: a scheduled workflow that fails silently is how this repo lost a
  # fortnight of data. `always()` is load-bearing — without it this job is skipped
  # on failure, which is precisely the case it exists for.
  alert:
    needs: [refresh]
    if: always()
    uses: ./.github/workflows/scheduled-failure-alert.yml
    # A CALLER's job permissions are the ceiling for the CALLED workflow, exactly
    # as a workflow-level block is the ceiling for its jobs. Granting only
    # `issues: write` here zeroes `contents`, and scheduled-failure-alert.yml's
    # job asks for `contents: read` because it runs actions/checkout — so the
    # whole file was REJECTED (startup_failure, zero jobs) on every wired
    # workflow. Both scopes must be granted at BOTH levels.
    permissions:
      contents: read
      issues: write
    with:
      workflow: refresh-data.yml
      conclusion: ${{ needs.refresh.result }}
      detail: ${{ needs.refresh.outputs.quarantine == '2' && 'Instruments were QUARANTINED by the vintage guard and their previous fixtures kept; every OTHER ticker refreshed. This red is deliberate. Investigate the named bars.' || 'The data refresh did not complete. scripts/backtestData/ is now staler than it should be, and the benchmark reads it.' }}
